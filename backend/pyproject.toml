[project]
name = "thryv-backend"
version = "2.0.0"
description = "THRYV — Your Personal AI. Created by Omkar Zunje."
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "fastapi-users[sqlalchemy]>=15,<16",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2,<2",
    "numpy>=2,<3",
    "onnxruntime>=1.24,<2",
    "piper-tts>=1.3,<2",
    "pocketsphinx>=5.1,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
wake-training = ["scikit-learn>=1.9,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
