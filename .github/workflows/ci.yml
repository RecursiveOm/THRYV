name: THRYV checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --locked --extra voice
        working-directory: backend
      - run: uv run --inexact ruff check app tests migrations scripts && uv run --inexact ruff format --check app tests migrations scripts && uv run --inexact pytest -q
        working-directory: backend
      - run: uv run --extra voice pip-audit
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: companion
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q && uv run pip-audit
        working-directory: companion
